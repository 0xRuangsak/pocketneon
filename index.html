<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07060f">
  <title>Pocket Neon</title>
  <meta name="description" content="Neon games to play with friends, right in your browser.">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
    header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: clamp(2rem, 9vw, 3.4rem); }
    .tagline { color: var(--dim); font-size: 1.15rem; margin: 14px 0 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .game {
      position: relative; display: block; text-decoration: none; color: inherit;
      padding: 18px; overflow: hidden; transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }
    a.game:hover { transform: translateY(-3px); border-color: var(--cyan); box-shadow: 0 0 24px rgba(46, 232, 255, 0.25); }
    .game h2 { font: 700 1.35rem var(--font-body); margin: 14px 0 4px; letter-spacing: 0.02em; }
    .game p { margin: 0; color: var(--dim); }
    .tag {
      position: absolute; top: 14px; right: 14px; font: 700 0.72rem var(--font-body);
      letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px;
      color: var(--lime); border: 1px solid var(--lime); text-shadow: var(--glow-lime);
    }
    .game.soon { opacity: 0.45; }
    .game.soon .tag { color: var(--dim); border-color: var(--line); text-shadow: none; }

    /* Isometric tile art */
    .art { height: 110px; display: grid; place-items: center; perspective: 600px; }
    .tile {
      width: 92px; height: 92px; border-radius: 14px;
      transform: rotateX(58deg) rotateZ(45deg);
      border: 2px solid var(--cyan); box-shadow: var(--glow-cyan), inset 0 0 18px rgba(46, 232, 255, 0.35);
      background: repeating-linear-gradient(0deg, transparent 0 15px, rgba(46, 232, 255, 0.12) 15px 16px),
                  repeating-linear-gradient(90deg, transparent 0 15px, rgba(46, 232, 255, 0.12) 15px 16px);
      position: relative;
    }
    .tile.pink { border-color: var(--pink); box-shadow: var(--glow-pink), inset 0 0 18px rgba(255, 63, 168, 0.35); }
    .tile .chip {
      position: absolute; width: 28px; height: 28px; border-radius: 50%; left: 32px; top: 32px;
      border: 3px dashed var(--pink); box-shadow: var(--glow-pink); background: rgba(255, 63, 168, 0.15);
    }
    .art .cards { position: absolute; display: flex; gap: 4px; transform: translateY(-14px); }
    .art .cards span {
      width: 30px; height: 42px; border-radius: 5px; background: #110f22; border: 1.5px solid var(--text);
      display: grid; place-items: center; font: 800 0.95rem var(--font-body);
    }
    .art .cards span:first-child { transform: rotate(-8deg); color: var(--pink); border-color: var(--pink); box-shadow: var(--glow-pink); }
    .art .cards span:last-child { transform: rotate(8deg); color: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow-cyan); }

    footer { text-align: center; color: var(--dim); margin-top: 48px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="logo"><span class="a">POCKET</span> <span class="b">NEON</span></h1>
      <p class="tagline">Neon games to play with a friend. No app, no sign-up.</p>
    </header>

    <section class="grid">
      <a class="game panel" href="games/holdem/">
        <span class="tag">1 v 1 online</span>
        <div class="art">
          <div class="tile"><div class="chip"></div></div>
          <div class="cards"><span>A♥</span><span>K♠</span></div>
        </div>
        <h2>Texas Hold'em</h2>
        <p>Heads-up tournament. 10,000 chips, blinds keep rising.</p>
      </a>

      <div class="game panel soon" aria-disabled="true">
        <span class="tag">Soon</span>
        <div class="art"><div class="tile pink"></div></div>
        <h2>Next game</h2>
        <p>More games coming, one at a time.</p>
      </div>
    </section>

    <footer>Pocket Neon · games play peer-to-peer, straight between your browsers.</footer>
  </main>
</body>
</html>
